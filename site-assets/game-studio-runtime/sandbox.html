x + 2] || \"\")) traceback.push(lines[index + 2]);\n    } else {\n      const frameLine = sourceLines[Number(location[1]) - 1];\n      if (frameLine) traceback.push(`    ${frameLine}`);\n    }\n  }\n  if (traceback.length === 1) {\n    traceback.push(`  File \"main.py\", line ${lineNumber ?? \"?\"}, in \u003cmodule\u003e`);\n    if (sourceLine !== null) traceback.push(`    ${sourceLine}`);\n  }\n  traceback.push(terminal);\n\n  return {\n    errorType,\n    explanation: explanations[errorType] || \"Python could not finish this program. Read the traceback and check the highlighted line.\",\n    lineNumber,\n    sourceLine,\n    traceback: traceback.join(\"\\n\").slice(0, 12000),\n    technical: String(error?.stack || raw).slice(0, 24000),\n  };\n}\n\n// The browser combines this module's source with the self-contained data: worker.\nglobalThis.studio_format_python_error = formatPythonError;\n","bootstrap":"\"\"\"Experimental worker-only adapter for a subset of pygame-ce.\n\npygame's drawing, surfaces, fonts and events are real pygame-ce objects. The\nwindow, input and clock are adapted because SDL's browser window needs a DOM.\nThis is compatibility glue, not a Python or JavaScript security sandbox.\n\"\"\"\nimport asyncio\nimport json\nimport time\n\nimport pygame\nfrom js import studio_present, studio_should_render, studio_take_input\n\n_screen = None\n_events = []\n_held = set()\n_mouse_position = (0, 0)\n_mouse_buttons = set()\n_last_mouse_position = (0, 0)\n_real_sleep = asyncio.sleep\n_frame_deadline = None\n\n\nasync def _browser_sleep(delay, result=None):\n    # Account for work done during the frame instead of adding 1/60s after it.\n    global _frame_deadline\n    if delay == 0:\n        now = time.perf_counter()\n        if _frame_deadline is None or now - _frame_deadline \u003e 0.1:\n            _frame_deadline = now + 1 / 60\n        wait = max(0, _frame_deadline - now)\n        _frame_deadline += 1 / 60\n        return await _real_sleep(wait, result)\n    return await _real_sleep(delay, result)\n\n\ndef _init():\n    pygame.font.init()\n    return (1, 0)\n\n\ndef _set_mode(size=(640, 480), flags=0, depth=0, display=0, vsync=0):\n    global _screen\n    width, height = map(int, size)\n    if not (1 \u003c= width \u003c= 1280 and 1 \u003c= height \u003c= 960):\n        raise ValueError(\"Studio preview size must be between 1x1 and 1280x960\")\n    if flags \u0026 pygame.OPENGL:\n        raise NotImplementedError(\"OpenGL display modes are not supported by the studio adapter\")\n    _screen = pygame.Surface((width, height))\n    return _screen\n\n\ndef _flip(*_args):\n    if _screen is None:\n        raise pygame.error(\"No studio display has been created\")\n    if not studio_should_render():\n        return\n    width, height = _screen.get_size()\n    studio_present(width, height, pygame.image.tobytes(_screen, \"RGBA\"))\n\n\ndef _key_code(code):\n    special = {\n        \"ArrowUp\": pygame.K_UP, \"ArrowDown\": pygame.K_DOWN,\n        \"ArrowLeft\": pygame.K_LEFT, \"ArrowRight\": pygame.K_RIGHT,\n        \"Space\": pygame.K_SPACE, \"Escape\": pygame.K_ESCAPE,\n        \"Enter\": pygame.K_RETURN, \"Backspace\": pygame.K_BACKSPACE,\n        \"ShiftLeft\": pygame.K_LSHIFT, \"ShiftRight\": pygame.K_RSHIFT,\n    }\n    if code in special:\n        return special[code]\n    if len(code) == 4 and code.startswith(\"Key\") and code[3].isalpha():\n        return ord(code[3].lower())\n    if len(code) == 6 and code.startswith(\"Digit\") and code[5].isdigit():\n        return ord(code[5])\n    return pygame.K_UNKNOWN\n\n\ndef _pump():\n    global _mouse_position, _last_mouse_position\n    for item in json.loads(studio_take_input()):\n        kind = item.get(\"type\")\n        if kind == \"blur\":\n            for key in tuple(_held):\n                _events.append(pygame.event.Event(pygame.KEYUP, key=key, unicode=\"\", mod=0))\n            for button in tuple(_mouse_buttons):\n                _events.append(\n isinstance(exclude, int) else set(exclude)\n    selected = [event for event in _events if (allowed is None or event.type in allowed) and event.type not in excluded]\n    _events[:] = [event for event in _events if event not in selected]\n    return selected\n\n\nclass _Pressed:\n    def __getitem__(self, key):\n        return key in _held\n\n\ndef _pressed():\n    _pump()\n    return _Pressed()\n\n\ndef _get_mouse_buttons(num_buttons=3):\n    return tuple(number in _mouse_buttons for number in range(1, num_buttons + 1))\n\n\ndef _mouse_pos():\n    _pump()\n    return _mouse_position\n\n\ndef _mouse_pressed(num_buttons=3):\n    _pump()\n    return _get_mouse_buttons(num_buttons)\n\n\nclass _Clock:\n    def __init__(self):\n        self._last = time.perf_counter()\n        self._elapsed = 0\n\n    def tick(self, _fps=0):\n        now = time.perf_counter()\n        self._elapsed = max(0, round((now - self._last) * 1000))\n        self._last = now\n        return self._elapsed\n\n    tick_busy_loop = tick\n\n    def get_time(self):\n        return self._elapsed\n\n    get_rawtime = get_time\n\n    def get_fps(self):\n        return 1000 / self._elapsed if self._elapsed else 0.0\n\n\npygame.init = _init\npygame.quit = lambda: None\npygame.display.set_mode = _set_mode\npygame.display.get_surface = lambda: _screen\npygame.display.flip = _flip\npygame.display.update = _flip\npygame.display.set_caption = lambda *_args: None\npygame.event.get = _get_events\npygame.event.pump = _pump\npygame.key.get_pressed = _pressed\npygame.key.get_mods = lambda: 0\npygame.mouse.get_pos = _mouse_pos\npygame.mouse.get_pressed = _mouse_pressed\npygame.time.Clock = _Clock\n\n\nasync def studio_execute(source):\n    \"\"\"Execute the submitted file and wait for its Pygbag-style asyncio.run().\"\"\"\n    global _frame_deadline\n    _frame_deadline = None\n    tasks = []\n    original_run, original_sleep = asyncio.run, asyncio.sleep\n\n    def schedule(coro, **_kwargs):\n        task = asyncio.create_task(coro)\n        tasks.append(task)\n        return task\n\n    try:\n        # Pyodide already has an event loop. Schedule Pygbag-style entry points.\n        asyncio.run = schedule\n        asyncio.sleep = _browser_sleep\n        namespace = {\"__name__\": \"__main__\", \"__file__\": \"main.py\"}\n        exec(compile(source, \"main.py\", \"exec\"), namespace)\n        if tasks:\n            await asyncio.gather(*tasks)\n    finally:\n        asyncio.run, asyncio.sleep = original_run, original_sleep\n"},"samples":{"dino-runner":"\"\"\"\nDino Game - a simple Chrome-dinosaur-style endless runner made with pygame.\n\nControls:\n    SPACE / UP ARROW  - Jump\n    R                 - Restart after Game Over\n    ESC               - Quit\n\nInstall pygame first if you don't have it:\n    pip install pygame\n\nThen run:\n    python dino_game.py\n\"\"\"\n\nimport asyncio\nimport pygame\nimport random\n\n# ---------------------------------------------------------------------------\n# Setup\n# ---------------------------------------------------------------------------\npygame.init()\n\nSCREEN_WIDTH = 800\nSCREEN_HEIGHT = 400\nGROUND_Y = 320\n\nWHITE = (255, 255, 255)\nBLACK = (30, 30, 30)\nGRAY = (120, 120, 120)\nRED = (200, 40, 40)\n\nscreen = pygame.display.set_mode((SCREEN_WIDTH, SCREEN_HEIGHT))\npygame.display.set_caption(\"Dino Game\")\nclock = pygame.time.Clock()\nFPS = 60\n\nfont_small = pygame.font.SysFont(\"Arial\", 22)\nfont_big = pygame.font.SysFont(\"Arial\", 48, bold=True)\n\n# ---------------------------------------------------------------------------\n# Dino (player)\n# ---------------------------------------------------------------------------\nclass Dino:\n    def __init__(self):\n        self.width = 40\n        self.height = 50\n        self.x = 60\n        self.y = GROUND_Y - self.height\n        self.vel_y = 0\n        self.gravity = 1.4\n        self.jump_strength = -20\n        self.is_jumping = False\n\n    def jump(self):\n        if not self.is_jumping:\n            self.is_jumping = True\n            self.vel_y = self.jump_strength\n\n    def update(self):\n        if self.is_jumping:\n            self.y += self.vel_y\n            self.vel_y += self.gravity\n            if self.y \u003e= GROUND_Y - self.height:\n                self.y = GROUND_Y - self.height\n                self.is_jumping = False\n                self.vel_y = 0\n\n    def draw(self, surface):\n        rect = pygame.Rect(self.x, self.y, self.width, self.height)\n        pygame.draw.rect(surface, BLACK, rect, border_radius=6)\n        # simple eye so it looks a little less like a plain box\n        eye_x = self.x + self.width - 10\n        eye_y = self.y + 10\n        pygame.draw.circle(surface, WHITE, (eye_x, eye_y), 4)\n\n    def get_rect(self):\n        return pygame.Rect(self.x, self.y, self.width, self.height)\n\n\n# ---------------------------------------------------------------------------\n# Obstacle (cactus)\n# ---------------------------------------------------------------------------\nclass Obstacle:\n    def __init__(self, x_start, speed):\n        self.width = random.choice([20, 28, 36])\n        self.height = random.choice([40, 55, 70])\n        self.x = x_start\n        self.y = GROUND_Y - self.height\n        self.speed = speed\n\n    def update(self):\n        self.x -= self.speed\n\n    def draw(self, surface):\n        rect = pygame.Rect(self.x, self.y, self.width, self.height)\n        pygame.draw.rect(surface, (30, 120, 30), rect, border_radius=4)\n\n    def off_screen(self):\n        return self.x + self.width \u003c 0\n\n    def get_rect(self):\n        return pygame.Rect(self.x, self.y, self.width, self.height)\n\n\n# ---------------------------------------------------------------------------\n# Game state / helpers\n# ---------------------------------------------------------------------------\ndef reset_game():\n    global dino, obstacles, speed, score, game_over, spawn_timer, spawn_interval\n    dino = Dino()\n    obstacles = []\n    speed = 8\n    score = 0\n    game_over = False\n    spawn_timer = 0\n    spawn_interval = random.randint(60, 110)\n\n\ndef draw_ground(surface, scroll_x):\n    pygame.draw.line(surface, GRAY, (0, GROUND_Y), (SCREEN_WIDTH, GROUND_Y), 3)\n    # a few dashes that scroll to sell the sense of motion\n    dash_width = 20\n    gap = 30\n    total = dash_width + gap\n    offset = int(scroll_x) % total\n    x = -offset\n    while x \u003c SCREEN_WIDTH:\n        pygame.draw.line(\n            surface, GRAY, (x, GROUND_Y + 10), (x + dash_width, GROUND_Y + 10), 2\n        )\n        x += total\n\n\ndef draw_score(surface, score):\n    text = font_small.render(f\"Score: {score}\", True, BLACK)\n    surface.blit(text, (SCREEN_WIDTH - text.get_width() - 15, 15))\n\n\ndef draw_game_over(surface, score):\n    text = font_big.render(\"GAME OVER\", True, RED)\n    surface.blit(\n        text,\n        (SCREEN_WIDTH // 2 - text.get_width() // 2, SCREEN_HEIGHT // 2 - 60),\n    )\n    sub = font_small.render(\n        f\"Score: {score}   -   Press R to restart\", True, BLACK\n    )\n    surface.blit(\n        sub,\n        (SCREEN_WIDTH // 2 - sub.get_width() // 2, SCREEN_HEIGHT // 2 + 5),\n    )\n\n\n# ---------------------------------------------------------------------------\n# Main loop\n# ---------------------------------------------------------------------------\nasync def main():\n    global dino, obstacles, speed, score, game_over, spawn_timer, spawn_interval\n\n    reset_game()\n    ground_scroll = 0\n    frame_count = 0\n\n    running = True\n    while running:\n        clock.tick(FPS)\n\n        for event in pygame.event.get():\n            if event.type == pygame.QUIT:\n                running = False\n            elif event.type == pygame.KEYDOWN:\n                if event.key == pygame.K_ESCAPE:\n                    running = False\n                elif event.key in (pygame.K_SPACE, pygame.K_UP):\n                    if not game_over:\n                        dino.jump()\n                elif event.key == pygame.K_r and game_over:\n                    reset_game()\n\n        if not game_over:\n            frame_count += 1\n            dino.update()\n            ground_scroll += speed\n\n            # Spawn obstacles on a timer\n            spawn_timer += 1\n            if spawn_timer \u003e= spawn_interval:\n                obstacles.append(Obstacle(SCREEN_WIDTH + 10, speed))\n                spawn_timer = 0\n                spawn_interval = random.randint(60, 110)\n\n            # Update obstacles, remove off-screen ones, check collisions\n            for obs in obstacles[:]:\n                obs.update()\n                if obs.off_screen():\n                    obstacles.remove(obs)\n                    score += 1\n                if dino.get_rect().colliderect(obs.get_rect()):\n                    game_over = True\n\n            # Difficulty ramps up slowly over time\n            if frame_count % 300 == 0:\n                speed += 0.5\n\n        # ---- Drawing ----\n        screen.fill(WHITE)\n        draw_ground(screen, ground_scroll)\n        dino.draw(screen)\n        for obs in obstacles:\n            obs.draw(screen)\n        draw_score(screen, score)\n\n        if game_over:\n            draw_game_over(screen, score)\n\n        pygame.display.flip()\n        await asyncio.sleep(0)\n\n    pygame.quit()\n\nasyncio.run(main())\n"}};

  if (!input || typeof input !== "object" || typeof input.type !== "string") return false;
  if (input.type === "blur") return true;
  if (input.type === "keydown" || input.type === "keyup") {
    return typeof input.code === "string" && input.code.length <= 32 &&
      typeof input.key === "string" && input.key.length <= 32 &&
      typeof input.repeat === "boolean";

    return Number.isInteger(input.x) && input.x >= 0 && input.x < 1280 &&
      Number.isInteger(input.y) && input.y >= 0 && input.y < 960 &&

    worker.onmessage = (workerEvent) => {
      const result = workerEvent.data;
      if (!result || typeof result !== "object") return;
      if (result.type === "heartbeat") {
        lastHeartbeat = performance.now();
        if (monitoring && warned) {
          warned = false;
          send({ type: "status", text: "The program is responding again." });
        }
        return;
      }
      if (!monitoring && result.type === "status" && typeof result.text === "string" && result.text.startsWith("Running program.")) {
        monitoring = true;
        lastHeartbeat = performance.now();
        watchdog = setInterval(() => {
          if (monitoring && !warned && performance.now() - lastHeartbeat > 3500) {
            warned = true;
            send({ type: "warning", text: "The program may be stuck or busy. Press Stop to end it." });
          }
        }, 1000);
      }
      if (result.type === "frame" && Number.isInteger(result.width) && Number.isInteger(result.height) &&
          result.width > 0 && result.height > 0 && result.width <= 1280 && result.height <= 960 &&
          result.pixels instanceof ArrayBuffer && result.pixels.byteLength === result.width * result.height * 4) {
        send(result, [result.pixels]);
      } else if (result.type === "python-error" &&
                 typeof result.errorType === "string" && typeof result.explanation === "string" &&
                 typeof result.traceback === "string" && typeof result.technical === "string" &&
                 (result.lineNumber === null || Number.isInteger(result.lineNumber)) &&
                 (result.sourceLine === null || typeof result.sourceLine === "string")) {
        send({
          type: result.type,
          errorType: result.errorType.slice(0, 100),
          explanation: result.explanation.slice(0, 1000),
          lineNumber: result.lineNumber,
          sourceLine: result.sourceLine?.slice(0, 2000) ?? null,
          traceback: result.traceback.slice(0, 12000),
          technical: result.technical.slice(0, 24000),
        });
        stopWorker();
      } else if (["status", "output", "error", "done", "warning"].includes(result.type) && typeof result.text === "string") {
        send({
          type: result.type,
          text: result.text.slice(0, 8192),
          technical: typeof result.technical === "string" ? result.technical.slice(0, 24000) : "",
          elapsed: Number(result.elapsed) || 0,
        });
        if (result.type === "error" || result.type === "done") stopWorker();
      }
    };
    worker.onerror = (error) => {
      stopWorker();
      send({ type: "error", text: `Worker failed: ${error.message || "unknown error"}. Check the browser Console for the underlying error.` });
    };
    worker.postMessage({ type: "start", code, bootstrap: runtime.bootstrap });
  } catch (error) {
    stop();
    send({ type: "error", text: `Could not create the worker: ${error.message}` });
  }
}
addEventListener("message", (event) => {
  if (event.source !== parent || !event.data || typeof event.data !== "object") return;
  const message = event.data;
  if (message.type === "stop") {
    stop();
    send({ type: "stopped" });
  } else if (message.type === "input" && worker && validInput(message.input)) {
    worker.postMessage({ type: "input", input: message.input });
  } else if (message.type === "start-demo" && !worker && PUBLIC_DEMO_BUNDLE &&
             message.sample === "dino-runner" &&
             typeof PUBLIC_DEMO_BUNDLE.samples?.[message.sample] === "string" &&
             PUBLIC_DEMO_BUNDLE.samples[message.sample].length <= 102400) {
    const runtime = PUBLIC_DEMO_BUNDLE.runtime;
    if (runtime && typeof runtime.workerSource === "string" && runtime.workerSource.length < 100000 &&
        typeof runtime.errorFormatter === "string" && runtime.errorFormatter.length < 100000 &&
        typeof runtime.bootstrap === "string" && runtime.bootstrap.length < 100000) {
      launchWorker(runtime, PUBLIC_DEMO_BUNDLE.samples[message.sample]);
    }
  } else if (message.type === "start" && !PUBLIC_DEMO_BUNDLE && !worker &&
             typeof message.workerSource === "string" && message.workerSource.length < 100000 &&
             typeof message.errorFormatter === "string" && message.errorFormatter.length < 100000 &&
             typeof message.bootstrap === "string" && message.bootstrap.length < 100000 &&
             typeof message.code === "string" && message.code.length <= 102400) {
    launchWorker(message, message.code);
  }
});
send({ type: "sandbox-ready" });
</script>
