name: Build and publish Copper Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned build dependency
        run: python -m pip install pygbag==0.9.3

      - name: Validate game manifest
        run: python scripts/manifest_utils.py

      - name: Run build infrastructure tests
        run: python -m unittest discover -s tests -v

      - name: Build all registered games
        run: python scripts/prepare_games.py

      - name: Assemble homepage and game site
        run: python scripts/assemble_site.py

      - name: Check assembled website
        run: python scripts/check_site.py

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./build/site
