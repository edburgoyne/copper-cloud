<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Battle Royale Mini cover</title>
  <desc id="desc">A top-down grassy arena with a shrinking purple storm ring, blue player, red bots, and loot.</desc>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#e1edcf" stroke-opacity=".12" stroke-width="2"/>
      <circle cx="14" cy="19" r="2" fill="#d8edbe" fill-opacity=".24"/>
      <circle cx="47" cy="48" r="1.5" fill="#d8edbe" fill-opacity=".18"/>
    </pattern>
    <linearGradient id="ground" x2="0" y2="1">
      <stop stop-color="#52764a"/>
      <stop offset="1" stop-color="#273f31"/>
    </linearGradient>
    <linearGradient id="shade" x2="0" y2="1">
      <stop stop-color="#09120e" stop-opacity=".05"/>
      <stop offset="1" stop-color="#09120e" stop-opacity=".68"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#ground)"/>
  <rect width="960" height="540" fill="url(#grid)"/>
  <g fill="#31573b" stroke="#1d392a" stroke-width="5">
    <circle cx="118" cy="112" r="43"/><circle cx="829" cy="116" r="49"/>
    <circle cx="165" cy="389" r="51"/><circle cx="809" cy="399" r="39"/>
  </g>
  <g fill="#849777" stroke="#3a4d3e" stroke-width="5">
    <path d="m642 90 28-18 31 12 7 31-25 19-35-9z"/>
    <path d="m283 365 25-21 31 12 9 29-24 21-34-11z"/>
  </g>
  <circle cx="482" cy="266" r="215" fill="#794ee8" fill-opacity=".2" stroke="#bd93ff" stroke-width="9"/>
  <circle cx="482" cy="266" r="172" fill="none" stroke="#d2b5ff" stroke-opacity=".55" stroke-width="3" stroke-dasharray="12 12"/>
  <g>
    <circle cx="398" cy="262" r="27" fill="#65a8ff" stroke="#10243b" stroke-width="6"/>
    <path d="m414 245 34-25" fill="none" stroke="#f1f4e9" stroke-width="8" stroke-linecap="round"/>
    <circle cx="583" cy="207" r="24" fill="#f0786e" stroke="#3e1918" stroke-width="6"/>
    <circle cx="560" cy="339" r="23" fill="#e36e65" stroke="#3e1918" stroke-width="6"/>
    <circle cx="337" cy="164" r="21" fill="#e36e65" stroke="#3e1918" stroke-width="6"/>
  </g>
  <g stroke="#342817" stroke-width="5">
    <rect x="492" y="183" width="36" height="36" rx="7" fill="#f5c653"/>
    <path d="M510 190v22m-8-11h16" stroke="#72551c" stroke-width="5"/>
    <rect x="459" y="351" width="35" height="29" rx="5" fill="#b98450"/>
    <path d="m459 359 18 10 17-10" fill="none" stroke="#e0b477" stroke-width="4"/>
  </g>
  <rect width="960" height="540" fill="url(#shade)"/>
  <g font-family="system-ui, sans-serif" font-weight="800">
    <text x="52" y="438" fill="#c1f075" font-size="18" letter-spacing="5">SURVIVE THE STORM</text>
    <text x="48" y="493" fill="#fffdf4" font-size="48" letter-spacing="-2">BATTLE ROYALE MINI</text>
